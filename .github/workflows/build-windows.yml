name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 按照你的要求：不限制 Flutter 版本，使用 stable 通道自动获取最新稳定版
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 项目构建脚本依赖 Python 与 Rust（Windows 桌面端使用 Rust 管理蓝牙与 Java 引擎）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      # 项目前端位于 apple-watch-companion 目录，安装 Flutter 依赖
      - name: Install Flutter dependencies
        working-directory: apple-watch-companion
        run: flutter pub get

      # 这是仓库文档指定的 Windows 构建入口，内部会编译 Rust 并打包 Flutter 桌面应用
      - name: Build Windows application
        timeout-minutes: 20
        run: python tools/build.py windows

      # 核心：检查是否有文件生成。若上传路径下没有任何文件，步骤立即失败（Job 变红）
      - name: Verify and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-watch-connector-windows
          path: |
            apple-watch-companion/build/
            build/
            dist/
            output/
            windows-watch-host/target/
            **/*.exe
            **/*.dll
          if-no-files-found: error
          retention-days: 30
