name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust (stable, MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Setup Flutter (pinned 3.47.8)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: apple-watch-companion
        run: flutter pub get

      # 诊断步骤已修复：避免 PowerShell 5.1 将 cargo 的 stderr 误判为错误
      - name: Diagnose Rust build (cargo check)
        working-directory: apple-watch-companion
        shell: powershell
        run: |
          Write-Host "=== Running cargo check ==="
          # 让 cargo 自己重定向输出到文件，绕过 PowerShell 的管道包装
          cargo check --verbose > cargo-check.log 2>&1
          $exitCode = $LASTEXITCODE
          
          Write-Host "=== cargo check exit code: $exitCode ==="
          Write-Host "=== Last 80 lines of cargo-check.log ==="
          Get-Content cargo-check.log -Tail 80
          
          if ($exitCode -ne 0) {
            Write-Host "=== cargo check FAILED ==="
            exit $exitCode
          }

      - name: Build Windows application (verbose)
        timeout-minutes: 20
        run: python tools/build.py windows --verbose

      - name: Debug - list build outputs
        shell: powershell
        run: |
          Write-Host "=== 所有 .exe 文件 ==="
          Get-ChildItem -Path . -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== 所有 .dll 文件 ==="
          Get-ChildItem -Path . -Filter *.dll -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host "=== apple-watch-companion/build 目录结构 (深度 4) ==="
          $buildDir = "apple-watch-companion/build"
          if (Test-Path $buildDir) {
            Get-ChildItem -Path $buildDir -Recurse -Depth 4 -ErrorAction SilentlyContinue |
              Select-Object FullName
          } else {
            Write-Host "目录不存在: $buildDir"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-watch-connector-windows
          path: |
            apple-watch-companion/build/
            build/
            dist/
            output/
            **/*.exe
            **/*.dll
          if-no-files-found: error
          retention-days: 30
